services:
  nginx:
    build: .
    container_name: driveflowweb-nginx
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: driveflowweb-certbot
    env_file:
      - .env
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    # This service is invoked on-demand using `docker compose run --rm certbot <args>`
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]



